name: Integration regression tests

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Compile Python sources
        run: |
          python -m compileall -q custom_components tests

      - name: Run contract and protocol tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*_test.py; do
            echo "==> ${test_file}"
            python "${test_file}"
          done
